name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/olerichard/coffee-filter-api
  WEB_IMAGE: ghcr.io/olerichard/coffee-filter-web

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image-tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.image-tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Frontend/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.image-tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host hetzner
            HostName $HETZNER_HOST
            User $HETZNER_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose files
        run: |
          ssh hetzner 'mkdir -p /opt/coffee-filter'
          scp docker-compose.yml Caddyfile hetzner:/opt/coffee-filter/

      - name: Deploy containers
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          ssh hetzner "cd /opt/coffee-filter && printf 'IMAGE_TAG=%s\n' '$IMAGE_TAG' > .image.env"
          ssh hetzner "cd /opt/coffee-filter && docker compose --env-file .env --env-file .image.env pull"
          ssh hetzner "cd /opt/coffee-filter && docker compose --env-file .env --env-file .image.env up -d --remove-orphans"
          ssh hetzner "docker image prune -af --filter 'until=168h'"
